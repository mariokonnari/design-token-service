name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Pinned: ubuntu-latest starts migrating to Ubuntu 26.04 on 2026-10-19 (rollout completes 2026-11-19), see actions/runner-images#14748.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke:api
