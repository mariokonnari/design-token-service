# Local development database only. The credentials are throwaway and bound to
# localhost; never reuse them anywhere else. The major version matches what
# Supabase uses for new projects (ADR 0012). Port 5433 avoids clashing with a
# Postgres installed on the host.
services:
  postgres:
    image: postgres:17
    container_name: dts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dts
      POSTGRES_PASSWORD: dts
      POSTGRES_DB: dts_dev
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - dts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dts -d dts_dev']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  dts_pgdata:
